<rect width="1270" height="660" rx="12" fill="#fafafa"/>
<text x="635.0" y="38.0" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">How the right value set becomes active during a deployment</text>
<text x="635.0" y="60.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">The branch name flows through the pipeline to fabric-cicd, which activates the value set with exactly that name.</text>
<rect x="60.0" y="100.0" width="260.0" height="104.0" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-branch" xlink:href="#icon-branch" transform="translate(72.0 112.0) scale(1.667)"/>
<text x="114.0" y="122.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Merge PR into prod</text>
<text x="114.0" y="140.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Pull request uat → prod completed</text>
<text x="114.0" y="155.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Branch policy / reviewers apply</text>
<rect x="350.0" y="100.0" width="260.0" height="104.0" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-ado" xlink:href="#icon-ado" transform="translate(362.0 112.0) scale(1.667)"/>
<text x="404.0" y="122.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Pipeline run starts</text>
<text x="404.0" y="140.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Build.SourceBranchName = "prod"</text>
<text x="404.0" y="155.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">targetEnvironment = prod</text>
<rect x="640.0" y="100.0" width="260.0" height="104.0" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-ado" xlink:href="#icon-ado" transform="translate(652.0 112.0) scale(1.667)"/>
<text x="694.0" y="122.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Validate (no credentials)</text>
<text x="694.0" y="140.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">deploy.py --environment prod --check-only</text>
<text x="694.0" y="155.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Value set 'prod' exists and overrides</text>
<text x="694.0" y="170.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">every workspace/lakehouse/DB ID</text>
<rect x="930.0" y="100.0" width="260.0" height="104.0" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-ado" xlink:href="#icon-ado" transform="translate(942.0 112.0) scale(1.667)"/>
<text x="984.0" y="122.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Approve PROD</text>
<text x="984.0" y="140.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Azure DevOps environment PROD</text>
<text x="984.0" y="155.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Approval check before deploying</text>
<rect x="930.0" y="270.0" width="260.0" height="104.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-fabric" xlink:href="#icon-fabric" transform="translate(942.0 282.0) scale(1.667)"/>
<text x="984.0" y="292.0" font-size="12" font-weight="700" fill="#065f46" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Publish with fabric-cicd</text>
<text x="984.0" y="310.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">deploy.py --environment prod</text>
<text x="984.0" y="325.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Items published unchanged</text>
<text x="984.0" y="340.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">(no IDs are replaced)</text>
<polygon points="770.0,260.0 890,322.0 770.0,384.0 650,322.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
<text x="770.0" y="308.0" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">"prod" in settings.json</text>
<text x="770.0" y="324.0" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">valueSetsOrder?</text>
<text x="770.0" y="340.0" font-size="10" font-weight="400" fill="#78350f" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">(exact, case-sensitive)</text>
<rect x="350.0" y="270.0" width="260.0" height="104.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-varlib" xlink:href="#icon-varlib" transform="translate(362.0 282.0) scale(1.667)"/>
<text x="404.0" y="292.0" font-size="12" font-weight="700" fill="#065f46" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Activate value set 'prod'</text>
<text x="404.0" y="310.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">PATCH …/variableLibraries/{id}</text>
<text x="404.0" y="325.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">activeValueSetName = "prod"</text>
<text x="404.0" y="340.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Run log: Active value set changed</text>
<rect x="60.0" y="270.0" width="260.0" height="104.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-ado" xlink:href="#icon-ado" transform="translate(72.0 282.0) scale(1.667)"/>
<text x="114.0" y="292.0" font-size="12" font-weight="700" fill="#065f46" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Verify the Prod workspace</text>
<text x="114.0" y="310.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Active value set == prod</text>
<text x="114.0" y="325.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Every ID belongs to Prod</text>
<text x="114.0" y="340.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">References resolve, else FAIL</text>
<rect x="560.0" y="450.0" width="420.0" height="104.0" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" filter="url(#shadow)"/>
<use href="#icon-varlib" xlink:href="#icon-varlib" transform="translate(572.0 462.0) scale(1.667)"/>
<text x="614.0" y="472.0" font-size="12" font-weight="700" fill="#991b1b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">No match: Default value set is activated</text>
<text x="614.0" y="490.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">fabric-cicd only logs a warning: "does not match any value sets.</text>
<text x="614.0" y="505.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Using 'Default value set'" → Prod items read Dev IDs.</text>
<text x="614.0" y="520.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Prevented here by step 3, which fails before publishing.</text>
<text x="60.0" y="612.0" font-size="10" font-weight="700" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">LEGEND:</text>
<rect x="122.0" y="601.0" width="14.0" height="14.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="142.0" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Azure Repos</text>
<rect x="219.5" y="601.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="239.5" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Azure Pipelines</text>
<rect x="329.2" y="601.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="349.2" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Fabric</text>
<rect x="397.7" y="601.0" width="14.0" height="14.0" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="417.7" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Failure mode</text>
<line x1="497.4765625" y1="608" x2="523.4765625" y2="608" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="529.5" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Flow</text>
<use href="#icon-fabric" xlink:href="#icon-fabric" transform="translate(572.0 599.0) scale(1.000)"/>
<text x="594.0" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Fabric (custom glyph)</text>
