<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1270 660" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title-03-activation">
<title id="title-03-activation">How the right value set becomes active during a deployment</title>
