<polyline points="392.0,354.0 392.0,388.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1117.0,222.0 1117.0,256.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1117.0,354.0 1117.0,388.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>