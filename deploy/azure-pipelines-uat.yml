# Promotes Fabric items from the uat branch to anildwa-uat-workspace with fabric-cicd.
#
# Flow: develop in anildwa-dev-workspace -> commit to anildwa-fabric-dev from Fabric
#       -> pull request into uat -> this pipeline validates, waits for UAT approval,
#       publishes, and verifies the deployed definitions.
#
# Authentication uses the fabric-cicd-uat service connection (workload identity
# federation, no secret). Its service principal is Contributor on the UAT workspace only.

trigger:
  batch: true
  branches:
    include:
      - uat
  paths:
    exclude:
      - README.md

pr: none

# Item types to deploy. CI runs triggered by a merge to uat use the default (all types).
# For a manual run, choose Run pipeline and edit the list, e.g. "Notebook,DataPipeline".
# Out-of-scope items are left unchanged in UAT and must already exist there if referenced.
parameters:
  - name: items_in_scope
    displayName: Fabric item types to deploy (comma-separated)
    type: string
    default: 'Lakehouse,SQLDatabase,VariableLibrary,Notebook,DataPipeline'

variables:
  pythonVersion: '3.12'
  targetEnvironment: 'UAT'
  targetWorkspaceId: 'af368112-6272-4016-b950-1ec72eeaa87c'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate definitions
    jobs:
      - job: StaticCheck
        displayName: Check parameterization
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: $(pythonVersion)

          - script: python -m pip install --disable-pip-version-check -r deploy/requirements.txt
            displayName: Install deployment dependencies

          - script: python deploy/deploy.py --environment "$(targetEnvironment)" --items-in-scope "$ITEMS_IN_SCOPE" --check-only
            displayName: Validate parameter.yml against repository items
            env:
              ITEMS_IN_SCOPE: ${{ parameters.items_in_scope }}

  - stage: DeployUAT
    displayName: Deploy to UAT
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: PublishUAT
        displayName: Publish to anildwa-uat-workspace
        environment: UAT
        timeoutInMinutes: 50
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: UsePythonVersion@0
                  displayName: Use Python $(pythonVersion)
                  inputs:
                    versionSpec: $(pythonVersion)

                - script: python -m pip install --disable-pip-version-check -r deploy/requirements.txt
                  displayName: Install deployment dependencies

                - task: AzureCLI@2
                  displayName: Publish and verify with fabric-cicd
                  env:
                    ITEMS_IN_SCOPE: ${{ parameters.items_in_scope }}
                  inputs:
                    azureSubscription: fabric-cicd-uat
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)
                    inlineScript: |
                      set -euo pipefail
                      python deploy/deploy.py \
                        --environment "$(targetEnvironment)" \
                        --workspace-id "$(targetWorkspaceId)" \
                        --items-in-scope "$ITEMS_IN_SCOPE"
