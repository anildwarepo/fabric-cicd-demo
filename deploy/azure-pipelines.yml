# Deploys Fabric items to UAT or Prod with fabric-cicd.
#
# Flow: develop in anildwa-dev-workspace -> commit to the dev branch from Fabric
#       -> pull request dev -> uat -> this pipeline deploys anildwa-uat-workspace
#       -> pull request uat -> prod -> this pipeline deploys anildwa-prod-workspace.
#
# The branch that triggered the run selects the environment. The environment name is
# also the variable library value set that fabric-cicd activates in the target
# workspace, so value sets must be named exactly "uat" and "prod".
#
# Each environment has its own service connection (workload identity federation, no
# secret) whose service principal is Contributor on that environment's workspace only,
# and its own Azure DevOps environment with an approval check.

trigger:
  batch: true
  branches:
    include:
      - uat
      - prod
  paths:
    exclude:
      - README.md

pr: none

# Item types to deploy. Runs triggered by a merge use the default (all types).
# For a manual run, choose Run pipeline and edit the list, e.g. "Notebook,DataPipeline".
parameters:
  - name: items_in_scope
    displayName: Fabric item types to deploy (comma-separated)
    type: string
    default: 'Lakehouse,SQLDatabase,VariableLibrary,Notebook,DataPipeline'

variables:
  - name: pythonVersion
    value: '3.12'
  - name: targetEnvironment
    value: ${{ variables['Build.SourceBranchName'] }}
  - ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
      - name: targetWorkspaceId
        value: 'af368112-6272-4016-b950-1ec72eeaa87c'   # anildwa-uat-workspace
      - name: serviceConnection
        value: 'fabric-cicd-uat'
      - name: approvalEnvironment
        value: 'UAT'
  - ${{ if eq(variables['Build.SourceBranchName'], 'prod') }}:
      - name: targetWorkspaceId
        value: '__PROD_WORKSPACE_ID__'                  # anildwa-prod-workspace
      - name: serviceConnection
        value: 'fabric-cicd-prod'
      - name: approvalEnvironment
        value: 'PROD'

pool:
  vmImage: ubuntu-latest

stages:
  - ${{ if not(in(variables['Build.SourceBranchName'], 'uat', 'prod')) }}:
      - stage: UnsupportedBranch
        displayName: Unsupported branch
        jobs:
          - job: Fail
            steps:
              - checkout: none
              - script: |
                  echo "##vso[task.logissue type=error]Run this pipeline from the uat or prod branch (current: $(Build.SourceBranchName))."
                  exit 1
                displayName: Stop

  - ${{ else }}:
      - stage: Validate
        displayName: Validate definitions (${{ variables.targetEnvironment }})
        jobs:
          - job: StaticCheck
            displayName: Check value sets and item references
            steps:
              - checkout: self
                fetchDepth: 1

              - task: UsePythonVersion@0
                displayName: Use Python $(pythonVersion)
                inputs:
                  versionSpec: $(pythonVersion)

              - script: python -m pip install --disable-pip-version-check -r deploy/requirements.txt
                displayName: Install deployment dependencies

              - script: python deploy/deploy.py --environment "$(targetEnvironment)" --items-in-scope "$ITEMS_IN_SCOPE" --check-only
                displayName: Validate repository for $(targetEnvironment)
                env:
                  ITEMS_IN_SCOPE: ${{ parameters.items_in_scope }}

      - stage: Deploy
        displayName: Deploy to ${{ variables.approvalEnvironment }}
        dependsOn: Validate
        condition: succeeded()
        jobs:
          - deployment: Publish
            displayName: Publish to ${{ variables.approvalEnvironment }} workspace
            environment: ${{ variables.approvalEnvironment }}
            timeoutInMinutes: 50
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 1

                    - task: UsePythonVersion@0
                      displayName: Use Python $(pythonVersion)
                      inputs:
                        versionSpec: $(pythonVersion)

                    - script: python -m pip install --disable-pip-version-check -r deploy/requirements.txt
                      displayName: Install deployment dependencies

                    - task: AzureCLI@2
                      displayName: Publish and verify with fabric-cicd
                      env:
                        ITEMS_IN_SCOPE: ${{ parameters.items_in_scope }}
                      inputs:
                        azureSubscription: ${{ variables.serviceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          python deploy/deploy.py \
                            --environment "$(targetEnvironment)" \
                            --workspace-id "$(targetWorkspaceId)" \
                            --items-in-scope "$ITEMS_IN_SCOPE"
