# fabric-cicd parameterization.
# Rewrites Dev-specific references while publishing to a target workspace.
# Environment keys (UAT) must match the --environment passed to deploy.py.
#
# $workspace.$id and $items.<Type>.<Name>.$id are resolved by fabric-cicd at
# deploy time to the IDs of the items in the TARGET workspace.
#
# The SourceConnectionId/DestinationConnectionId library variables point to
# tenant-level shared connections and are intentionally reused by UAT. To give
# UAT its own connections, add key_value_replace entries for those variables.

find_replace:
  # Notebook default lakehouse: Dev CustomerDemographicsLakehouse -> target lakehouse.
  - find_value: "8340a38b-0be0-4b4d-a360-6492cff7ae66"
    replace_value:
      UAT: "$items.Lakehouse.CustomerDemographicsLakehouse.$id"
    item_type: "Notebook"
    item_name: "ExploreCustomerDemographics"

  # Notebook default lakehouse workspace: Dev workspace -> target workspace.
  - find_value: "e2ebf2eb-f7df-42a3-b5e3-e033cf7d32c6"
    replace_value:
      UAT: "$workspace.$id"
    item_type: "Notebook"
    item_name: "ExploreCustomerDemographics"

key_value_replace:
  # Variable library values consumed by CopyCustomerDemographics and the notebook.
  - find_key: $.variables[?(@.name=="DestinationWorkspaceId")].value
    replace_value:
      UAT: "$workspace.$id"
    item_type: "VariableLibrary"
    item_name: "CustomerDemographicsConfig"

  - find_key: $.variables[?(@.name=="DestinationDatabaseId")].value
    replace_value:
      UAT: "$items.SQLDatabase.wwi-importers.$id"
    item_type: "VariableLibrary"
    item_name: "CustomerDemographicsConfig"

  - find_key: $.variables[?(@.name=="LakehouseWorkspaceId")].value
    replace_value:
      UAT: "$workspace.$id"
    item_type: "VariableLibrary"
    item_name: "CustomerDemographicsConfig"

  - find_key: $.variables[?(@.name=="LakehouseId")].value
    replace_value:
      UAT: "$items.Lakehouse.CustomerDemographicsLakehouse.$id"
    item_type: "VariableLibrary"
    item_name: "CustomerDemographicsConfig"
